[package]
name = "bpane-gpu-dummy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Bounded virtual-display geometry and Present clock for the BrowserPane Xorg DDX"
repository = "https://github.com/grattis-digital/browserpane-hermes"
readme = "README.md"
keywords = ["xorg", "raspberry-pi", "graphics"]
categories = ["os::unix-apis"]

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
panic = "abort"
lto = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
