# Standalone laboratory display, NOT an override for compose.yaml/compose.gpu.yaml.
# No browser, profile, shared socket volume, KMS device, host network or restart loop.
services:
  gpu-dummy-test:
    build:
      context: .
      dockerfile: Dockerfile.gpu-dummy
      target: gpu-check
    labels:
      io.browserpane.test.purpose: gpu-dummy-lab
    user: 10000:10000
    network_mode: none
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    devices:
      - ${BPANE_GPU_RENDER_DEVICE:?Select the verified V3D render device}:/dev/bpane-render:rw
    group_add:
      - ${BPANE_GPU_RENDER_GID:?Select the verified render device group}
    volumes:
      # Visibility for libdrm resolution, NOT authorization to open other nodes.
      - /dev/dri:/dev/dri:ro
    tmpfs:
      - /tmp:size=128m,mode=1777,nosuid,nodev
    shm_size: 128m
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
