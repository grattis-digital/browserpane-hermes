# Explicit opt-in: see docs/GPU.md. CPU Compose remains the default.
services:
  browserpane:
    build: !reset null
    image: browserpane-hermes-browser:gpu-local
    pull_policy: never
    environment:
      BPANE_GPU_MODE: v3d
      BPANE_X11_BACKEND: xvnc
    ipc: service:gpu-display
    shm_size: !reset null
    devices:
      - ${BPANE_GPU_RENDER_DEVICE:?Run scripts/gpu-devices.sh}:/dev/bpane-render:rw
      - ${BPANE_GPU_DISPLAY_DEVICE:?Run scripts/gpu-devices.sh}:/dev/bpane-display:rw
    group_add:
      - ${BPANE_GPU_RENDER_GID:?Run scripts/gpu-devices.sh}
      - ${BPANE_GPU_DISPLAY_GID:?Run scripts/gpu-devices.sh}
    volumes:
      - gpu-x11:/tmp/.X11-unix
      # libdrm resolves canonical names through sysfs; only the two devices above
      # are openable. Read-only bind visibility is NOT the device-access boundary.
      - /dev/dri:/dev/dri:ro
    depends_on:
      gpu-display:
        condition: service_healthy
        restart: true

  gpu-display:
    build:
      context: .
      dockerfile: Dockerfile.gpu-display
    image: browserpane-hermes-gpu-display:local
    restart: unless-stopped
    network_mode: none
    ipc: shareable
    shm_size: 512m
    devices:
      - ${BPANE_GPU_RENDER_DEVICE:?Run scripts/gpu-devices.sh}:/dev/bpane-render:rw
      - ${BPANE_GPU_DISPLAY_DEVICE:?Run scripts/gpu-devices.sh}:/dev/bpane-display:rw
    group_add:
      - ${BPANE_GPU_RENDER_GID:?Run scripts/gpu-devices.sh}
      - ${BPANE_GPU_DISPLAY_GID:?Run scripts/gpu-devices.sh}
    volumes:
      - gpu-x11:/tmp/.X11-unix
      - /dev/dri:/dev/dri:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=128m,mode=1777,nosuid,nodev
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  gpu-x11: {}
